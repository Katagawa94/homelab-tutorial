# Website des Tutorials (GitHub Pages), gebaut mit MkDocs Material.
# Lokal ansehen: mkdocs serve  →  http://127.0.0.1:8000
site_name: Homelab-Tutorial
site_description: Kubernetes lernen mit Proxmox, k3s, Jellyfin und Tailscale – Schritt für Schritt für Einsteiger
site_url: https://katagawa94.github.io/homelab-tutorial/
repo_url: https://github.com/Katagawa94/homelab-tutorial
repo_name: Katagawa94/homelab-tutorial
edit_uri: edit/main/docs/

theme:
  name: material
  language: de
  icon:
    logo: material/home-automation
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dunkles Design
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Helles Design
  features:
    - navigation.sections
    - navigation.footer          # "Zurück"/"Weiter" unten auf jeder Seite
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy          # Kopier-Knopf an jedem Code-Block
    - content.action.edit
    - toc.follow

plugins:
  - search:
      lang: de

hooks:
  - hooks/links.py               # Links aus docs/ heraus (kubernetes/, examples/ …) auf GitHub umleiten

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true      # die ☐-Checklisten in den Checkpoints
  - toc:
      permalink: true
      # Überschriften-Anker wie auf GitHub (Umlaute bleiben erhalten), damit alle Links in beiden Welten funktionieren
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

validation:
  links:
    anchors: warn

nav:
  - Start: index.md
  - "Teil A – Fundament":
      - 00-einfuehrung.md
      - 01-voraussetzungen.md
      - 02-proxmox-installieren.md
      - 03-tailscale-proxmox.md
      - 04-kubernetes-vm.md
      - 05-k3s-installieren.md
  - "Teil B – Kubernetes-Grundlagen":
      - 06-erster-pod.md
      - 07-deployments-services.md
      - 08-konfiguration-daten.md
      - 09-helm.md
  - "Teil C – Die Plattform":
      - 10-tailscale-operator.md
      - 11-argocd.md
      - 12-sealed-secrets.md
  - "Teil D – Die wichtigsten Dienste":
      - 13-vaultwarden.md
      - 14-nextcloud.md
      - 15-pihole.md
  - "Teil E – Heimkino und *arr-Stack":
      - 16-jellyfin.md
      - 17-samsung-tv.md
      - 18-gpu-passthrough.md
      - 19-gpu-kubernetes.md
      - 20-arr-ueberblick.md
      - 21-qbittorrent-vpn.md
      - 22-prowlarr.md
      - 23-sonarr-radarr.md
      - 24-bazarr-seerr.md
  - "Teil F – Weitere Apps":
      - 25-homepage.md
      - 26-immich.md
      - 27-paperless.md
      - 28-uptime-kuma.md
  - "Teil G – Betrieb":
      - 29-backup-restore.md
      - 30-updates-wartung.md
      - 31-troubleshooting.md
  - "Teil H – Ausbau":
      - 32-speicher-erweitern.md
      - 33-monitoring.md
      - 34-mehr-nodes.md
  - Glossar: glossar.md
