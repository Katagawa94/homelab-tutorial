# Kapitel 25: Datenbank (SQLite) und Suchindex von Paperless.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false   # Argo CD darf diesen PVC nie löschen
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
