# Kapitel 11: Jellyfin, der Medienserver.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  labels:
    app: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate                # Datenbank! Nie zwei Jellyfins gleichzeitig
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        runAsUser: 1000           # als Benutzer 1000 laufen, dem gehört /data (Kapitel 04)
        runAsGroup: 1000
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12.1
          env:
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: http
              containerPort: 8096
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: data
              mountPath: /data
              readOnly: true      # Jellyfin liest Medien nur, verändern darf es sie nicht
          startupProbe:           # Wartet, bis Jellyfin hochgefahren ist (bis zu 5 Minuten)
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:         # Erst wenn das klappt, bekommt der Pod Anfragen
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:          # Klappt das 3x hintereinander nicht, wird Jellyfin neu gestartet
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache             # Zwischenspeicher fürs Transcoding, darf verloren gehen
          emptyDir:
            sizeLimit: 10Gi
        - name: data
          persistentVolumeClaim:
            claimName: media-data  # aus kubernetes/apps/media/basis
