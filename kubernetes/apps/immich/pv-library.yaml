# Kapitel 26: Die Fotos liegen auf der großen Datenplatte unter /data/photos.
# Wie media-data in Kapitel 16: handgemacht, Retain, für genau einen PVC reserviert.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain   # Fotos NIEMALS automatisch löschen
  storageClassName: ""
  claimRef:
    namespace: immich
    name: immich-library
  hostPath:
    path: /data/photos                    # vorher in der VM anlegen (Kapitel 26)
    type: Directory
