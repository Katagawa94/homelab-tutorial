# Kapitel 14: Nextcloud (offizielles Image mit Apache).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  labels:
    app: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate                # nie zwei Nextclouds auf denselben Dateien
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      containers:
        - name: nextcloud
          image: nextcloud:34.0.4-apache
          env:
            # Datenbank und Cache (Service-Namen aus postgres.yaml und redis.yaml)
            - name: POSTGRES_HOST
              value: nextcloud-postgres
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              value: nextcloud-redis
            # Erster Admin, wird nur bei der allerersten Installation angelegt
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: NEXTCLOUD_ADMIN_USER
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: NEXTCLOUD_ADMIN_PASSWORD
            # Unter welcher Adresse Nextcloud erreichbar ist (Tailscale macht HTTPS davor)
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: nextcloud.tail1a2b3c.ts.net
            - name: OVERWRITEHOST
              value: nextcloud.tail1a2b3c.ts.net
            - name: OVERWRITEPROTOCOL
              value: https
            - name: OVERWRITECLIURL
              value: https://nextcloud.tail1a2b3c.ts.net
            # Größere Uploads und etwas mehr Arbeitsspeicher für PHP
            - name: PHP_UPLOAD_LIMIT
              value: 10G
            - name: PHP_MEMORY_LIMIT
              value: 1G
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /var/www/html
            - name: data
              mountPath: /var/www/html/data   # deine Dateien → /data/nextcloud in der VM
          startupProbe:           # die erste Installation dauert ein paar Minuten
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
        # Zweiter Container im Pod: führt alle 5 Minuten Nextclouds Hintergrundaufgaben aus
        # (Aufräumen, Vorschaubilder, Benachrichtigungen …). Gleiches Image, gleiche Volumes.
        - name: cron
          image: nextcloud:34.0.4-apache
          command: ["/cron.sh"]
          volumeMounts:
            - name: html
              mountPath: /var/www/html
            - name: data
              mountPath: /var/www/html/data
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 1Gi
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: nextcloud-html
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-data
