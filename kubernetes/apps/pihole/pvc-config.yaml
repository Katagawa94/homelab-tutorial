# Kapitel 15: Einstellungen, Blocklisten und Statistiken von Pi-hole.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-config
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
