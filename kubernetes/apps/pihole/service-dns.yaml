# Kapitel 15: DNS auf Port 53 der VM, im Heimnetz (192.168.178.11) und im Tailnet (100.x.y.z).
apiVersion: v1
kind: Service
metadata:
  name: pihole-dns
  labels:
    app: pihole
spec:
  type: LoadBalancer              # k3s ServiceLB öffnet Port 53 auf der VM
  externalTrafficPolicy: Local    # damit Pi-hole die echten Geräte-Adressen sieht
  selector:
    app: pihole
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP               # normale DNS-Anfragen
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP               # große Antworten
