# Kapitel 13: Argo-CD-Weboberfläche im Tailnet unter https://argocd.<tailnet>.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: argocd-server
      port:
        number: 80
  tls:
    - hosts:
        - argocd                  # → https://argocd.<tailnet>.ts.net
