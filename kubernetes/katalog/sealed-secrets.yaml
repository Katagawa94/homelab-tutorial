# Kapitel 14: Sealed Secrets entschlüsselt SealedSecrets aus Git zu normalen Secrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  sources:
    # 1. Das Helm-Chart …
    - repoURL: https://bitnami-labs.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.20.0         # Chart-Version festhalten, Updates bewusst einspielen
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $values/kubernetes/infrastructure/sealed-secrets/values.yaml
    # 2. … mit den Values aus diesem Git-Repository ("$values" zeigt hierher)
    - repoURL: https://github.com/Katagawa94/homelab-tutorial.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
