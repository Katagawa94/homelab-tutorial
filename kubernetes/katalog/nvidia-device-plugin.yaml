# Kapitel 16: NVIDIA Device Plugin meldet die GPU als Ressource nvidia.com/gpu an Kubernetes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-device-plugin
  namespace: argocd
spec:
  project: default
  sources:
    # 1. Das Helm-Chart …
    - repoURL: https://nvidia.github.io/k8s-device-plugin
      chart: nvidia-device-plugin
      targetRevision: 0.20.1         # Chart-Version festhalten, Updates bewusst einspielen
      helm:
        releaseName: nvidia-device-plugin
        valueFiles:
          - $values/kubernetes/infrastructure/nvidia-device-plugin/values.yaml
    # 2. … mit den Values aus diesem Git-Repository ("$values" zeigt hierher)
    - repoURL: https://github.com/Katagawa94/homelab-tutorial.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia-device-plugin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
