# Kapitel 14: Alle verschlüsselten Secrets aus kubernetes/secrets/ (inkl. Unterordner).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Katagawa94/homelab-tutorial.git
    targetRevision: HEAD
    path: kubernetes/secrets
    directory:
      recurse: true               # auch Unterordner durchsuchen
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
