# Kapitel 27: Nächtliches Backup der Immich-Fotos mit restic.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-backup
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Katagawa94/homelab-tutorial.git
    targetRevision: HEAD
    path: kubernetes/apps/immich-backup
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
