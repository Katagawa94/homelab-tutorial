# Kapitel 10: Der Tailscale Operator bringt Apps mit HTTPS ins Tailnet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
spec:
  project: default
  sources:
    # 1. Das Helm-Chart …
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.102.4         # Chart-Version festhalten, Updates bewusst einspielen
      helm:
        releaseName: tailscale-operator
        valueFiles:
          - $values/kubernetes/infrastructure/tailscale-operator/values.yaml
    # 2. … mit den Values aus diesem Git-Repository ("$values" zeigt hierher)
    - repoURL: https://github.com/Katagawa94/homelab-tutorial.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
