name: Validierung

on:
  push:
  pull_request:

jobs:
  manifeste:
    name: YAML & Kubernetes-Manifeste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Werkzeuge installieren
        run: |
          pip install --quiet yamllint
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz
          KUSTOMIZE=https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1
          curl -sSL "$KUSTOMIZE/kustomize_v5.7.1_linux_amd64.tar.gz" | tar xz
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: yamllint
        run: yamllint -c .yamllint.yaml .

      - name: kubeconform
        run: scripts/validate.sh
