extends: default

# Von sops verschlüsselt (Kapitel 36): sehr lange Zeilen, nicht von Hand bearbeiten
ignore: |
  nixos/**/secrets.yaml

rules:
  document-start: disable
  line-length:
    max: 140
  comments:
    min-spaces-from-content: 1
  truthy:
    check-keys: false   # erlaubt "on:" in GitHub-Workflows
