# Kapitel 08: nginx liefert die Webseite aus der ConfigMap aus.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webseite
  namespace: lernen
  labels:
    app: webseite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webseite
  template:
    metadata:
      labels:
        app: webseite
    spec:
      containers:
        - name: nginx
          image: nginx:1.30
          ports:
            - containerPort: 80
          volumeMounts:
            - name: inhalt                        # welches Volume (siehe unten) …
              mountPath: /usr/share/nginx/html    # … wo im Container erscheinen soll
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: inhalt
          configMap:
            name: webseite                        # die ConfigMap aus configmap.yaml
