# Kapitel 10: Test des Tailscale Operators: whoami unter https://whoami.<tailnet>.ts.net
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: tailscale-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: tailscale-test
spec:
  selector:
    app: whoami
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: tailscale-test
spec:
  ingressClassName: tailscale     # "Tailscale, bitte kümmere dich um diesen Ingress"
  defaultBackend:
    service:
      name: whoami
      port:
        number: 80
  tls:
    - hosts:
        - whoami                  # → https://whoami.<tailnet>.ts.net
