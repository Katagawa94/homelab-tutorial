# Kapitel 07: Version 2 des Deployments, für das Rolling Update.
# Unterschiede zu deployment.yaml: neues Image (v1.12.0) und ein Name, den whoami anzeigt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: lernen
  labels:
    app: whoami
spec:
  replicas: 3
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0   # geändert
          env:                            # neu
            - name: WHOAMI_NAME
              value: version-2
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
